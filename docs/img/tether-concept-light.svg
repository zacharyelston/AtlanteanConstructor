<text x="254.0" y="288.0" font-size="11" font-weight="600" fill="#fcfcfb" text-anchor="middle">1</text>
<circle cx="381.1" cy="172.2" r="10" fill="#0b0b0b"/>
<text x="381.1" y="176.2" font-size="11" font-weight="600" fill="#fcfcfb" text-anchor="middle">2</text>
<circle cx="194.2" cy="98.3" r="10" fill="#0b0b0b"/>
<text x="194.2" y="102.3" font-size="11" font-weight="600" fill="#fcfcfb" text-anchor="middle">3</text>
<circle cx="41.2" cy="300.0" r="10" fill="#0b0b0b"/>
<text x="41.2" y="304.0" font-size="11" font-weight="600" fill="#fcfcfb" text-anchor="middle">4</text>
<circle cx="570.0" cy="80.0" r="10" fill="#0b0b0b"/>
<text x="570.0" y="84.0" font-size="11" font-weight="600" fill="#fcfcfb" text-anchor="middle">1</text>
<text x="588.0" y="84.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">Pivot and winch</text>
<text x="588.0" y="102.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">A winch on the centre post sets the radius.</text>
<text x="588.0" y="118.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">The leash also carries tether power, so</text>
<text x="588.0" y="134.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">there is no steering and no battery swap.</text>
<circle cx="570.0" cy="166.0" r="10" fill="#0b0b0b"/>
<text x="570.0" y="170.0" font-size="11" font-weight="600" fill="#fcfcfb" text-anchor="middle">2</text>
<text x="588.0" y="170.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">Cut laps</text>
<text x="588.0" y="188.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">The trencher drives around the ring towing</text>
<text x="588.0" y="204.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">a box scraper. Each lap cuts whatever depth</text>
<text x="588.0" y="220.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">the pull budget (grip or motor) allows.</text>
<circle cx="570.0" cy="252.0" r="10" fill="#0b0b0b"/>
<text x="570.0" y="256.0" font-size="11" font-weight="600" fill="#fcfcfb" text-anchor="middle">3</text>
<text x="588.0" y="256.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">Spiral ramp out</text>
<text x="588.0" y="274.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">When the pan is full, the winch walks the</text>
<text x="588.0" y="290.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">vehicle out on a spiral ramp to the paired</text>
<text x="588.0" y="306.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">berm. Ramp grade is limited by grip.</text>
<circle cx="570.0" cy="338.0" r="10" fill="#0b0b0b"/>
<text x="570.0" y="342.0" font-size="11" font-weight="600" fill="#fcfcfb" text-anchor="middle">4</text>
<text x="588.0" y="342.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">Spread and return</text>
<text x="588.0" y="360.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">It spreads the load in thin layers where</text>
<text x="588.0" y="376.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">the berm is lowest, grades it now and</text>
<text x="588.0" y="392.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">then, and spirals back to the cut.</text>
<text x="560.0" y="418.0" font-size="12" font-weight="600" fill="#52514e" text-anchor="start">In the cut (side view, not to scale)</text>
