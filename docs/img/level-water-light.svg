<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="t">Level-water design on a slope</title>
<desc id="d">Schematic section: each moat has one flat bed and one waterline, set from the lowest ground along the moat less freeboard. On the high side the cut is deeper, the banks rise at the side-slope angle until they meet existing ground, and the berms sit on top of existing ground.</desc>
